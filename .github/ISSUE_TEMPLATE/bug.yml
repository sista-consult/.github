name: Signaler un bug
description: Quelque chose ne marche pas comme prévu
labels: ["bug"]
body:
  - type: textarea
    id: probleme
    attributes:
      label: Que se passe-t-il ?
      description: Ce que vous avez constaté.
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Que devrait-il se passer ?
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Comment le reproduire ?
      placeholder: |
        1. Aller sur…
        2. Cliquer sur…
        3. Voir l'erreur
    validations:
      required: true
  - type: dropdown
    id: environnement
    attributes:
      label: Où ?
      options:
        - Production
        - Sur ma machine
    validations:
      required: true
